<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бележки и задачи</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Бележки и задачи</h1>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Напиши бележка или задача" autocomplete="off" required>
      
      <div class="date-row">
        <label for="task-start-date">От (по желание):</label>
        <input type="datetime-local" id="task-start-date">
      </div>

      <div class="date-row">
        <label for="task-end-date">До (по желание):</label>
        <input type="datetime-local" id="task-end-date">
      </div>

      <div class="btn-group">
        <button type="submit" id="add-btn">Добави</button>
        <button type="button" id="cancel-edit-btn" style="display: none;">Отказ</button>
      </div>
    </form>

    <ul id="task-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
